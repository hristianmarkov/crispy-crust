name: Notify search engines after production publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Submit canonical URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
