name: Notify search engines after production publication
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Submit canonical URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
